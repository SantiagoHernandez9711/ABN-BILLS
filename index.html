<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShiftBills</title>

    <!---Linkis-->
    <script type="text/javascript" nonce="9b3e17413ee94a1d9a7e45602a1" src="//local.adguard.org?ts=1790505097031&amp;type=content-script&amp;dmn=api.netlify.com&amp;url=https%3A%2F%2Fapi.netlify.com%2Fapi%2Fv1%2Fdeploys%2F6ab785ebd4d53f261ddb1daf%2Ffiles%2Findex.html&amp;app=com.apple.Safari&amp;css=3&amp;js=1&amp;rel=1&amp;rji=1&amp;sbe=1&amp;stealth=1&amp;st-push&amp;st-loc&amp;st-java&amp;st-dnt"></script><script type="text/javascript" nonce="9b3e17413ee94a1d9a7e45602a1" src="//local.adguard.org?ts=1790505097031&amp;name=AdGuard%20Extra&amp;type=user-script"></script><link rel="stylesheet" href="CSS/estilo.css">
    

</head>

<body>
    <!--Titulo-->

    <h1>ShiftBills</h1>

    <!---Primera parte del formulario-->

    <div class="section">
        <div class="section-title">Informacion del Invoice</div>
        <div class="row-2">
            <div>
                <label>Invoce #</label>
                <input type="text" id="inv-no" placeholder="EJ: INV-001">
            </div>
            <div>
                <label>Name</label>
                <input type="text" id="inv-name" placeholder="Full Name">
            </div>
        </div>
    </div>

    <!--.ICS-->

    <div class="section">
  <div class="section-title">Importar turnos desde el calendario</div>

<!--Barra de URL-->

  <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;">
    <div style="flex:1; min-width:200px;">
      <label>URL del calendario (.ics)</label>
      <input type="text" id="ics-url" placeholder="https://...">
    </div>
    <button class="btn-add" id="btn-load" onclick="loadCalendar()" style="width:auto; padding:0 20px; height:36px;">Cargar calendario</button>
  </div>

  <!--Barra de Filtros (ocualta al inicio)-->
  <div id="filter-bar" style="display:none; margin-top:12px; padding-top:12px; border-top:1px solid #eee;">
  <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:10px;">
    <div style="min-width:130px;">
      <label>Desde</label>
      <input type="date" id="filter-from">
    </div>
    <div style="min-width:130px;">
      <label>Hasta</label>
      <input type="date" id="filter-to">
    </div>
    <div style="flex:1; min-width:150px;">
      <label>Buscar lugar</label>
      <input type="text" id="filter-place" placeholder="Ej: Tooronga">
    </div>
    <button class="btn-add" onclick="renderEvents()" style="width:auto; padding:0 20px; height:36px;">Buscar</button>
  </div>
  <button class="btn-add" onclick="importSelected()" style="width:100%; height:40px;">+ Agregar turnos seleccionados al invoice</button>
</div>

<!--Lista de turnos-->
  <div id="events-container"></div>
</div>

    <!--Segunda Parte del formulario-->

    <div class="section">
        <div class="section-title">Lineas de trabajo</div>
        <div class="lines-header">
            <span>Date</span>
            <span> Building</span>
            <span>Rate ($/hr)</span>
            <span>Hours</span>
            <span>Total</span>
            <span></span>
        </div>
        <div id="lines-container"></div>
        <button class="btn-add" onclick="addlines()">+ Add Lines</button>
    </div>
    <!--Tiempo total de  Trabajo y horas de trabajo.-->
    <div class="totals-row">
        <div>
            <div class="tlabel">Total Horas</div>
            <div class="tvalue" id="sum-hours">0.00</div>
        </div>
        <div>
            <div class="tlabel">Total a Cobrar</div>
            <div class="tvalue" id="sum-total">0.00</div>

<!--JS-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="JS/data.js"></script>
        </div>
    </div>
</body>
<button class="btn-generate" onclick="generateExcel()">⬇ Descargar Excel (.xlsx)</button>
<div id="msg"></div>
</html>
